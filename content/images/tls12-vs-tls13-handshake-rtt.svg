<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <line x1="500" y1="30" x2="500" y2="590" stroke="#dde3e6" stroke-width="2"/>

  <!-- ===== LEFT: TLS 1.2, 2-RTT ===== -->
  <text x="240" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#14181b">TLS 1.2</text>
  <text x="240" y="76" text-anchor="middle" font-size="16" fill="#5b6670">풀 핸드셰이크 · 2 RTT</text>

  <line x1="110" y1="110" x2="110" y2="560" stroke="#c7cfd3" stroke-width="2"/>
  <line x1="370" y1="110" x2="370" y2="560" stroke="#c7cfd3" stroke-width="2"/>
  <text x="110" y="100" text-anchor="middle" font-size="15" fill="#5b6670">Client</text>
  <text x="370" y="100" text-anchor="middle" font-size="15" fill="#5b6670">Server</text>

  <!-- RTT1 bracket -->
  <path d="M 85 120 v 100 h 10" fill="none" stroke="#8a97a0" stroke-width="2"/>
  <text x="60" y="175" text-anchor="middle" font-size="13" fill="#8a97a0" transform="rotate(-90 60 175)">RTT 1</text>

  <line x1="110" y1="140" x2="370" y2="140" stroke="#8a97a0" stroke-width="3" marker-end="url(#arrLeft)"/>
  <text x="240" y="132" text-anchor="middle" font-size="13" fill="#5b6670">ClientHello</text>

  <line x1="370" y1="200" x2="110" y2="200" stroke="#8a97a0" stroke-width="3" marker-end="url(#arrLeft)"/>
  <text x="240" y="192" text-anchor="middle" font-size="13" fill="#5b6670">ServerHello · Certificate · ServerKeyExchange</text>

  <!-- RTT2 bracket -->
  <path d="M 85 240 v 100 h 10" fill="none" stroke="#8a97a0" stroke-width="2"/>
  <text x="60" y="295" text-anchor="middle" font-size="13" fill="#8a97a0" transform="rotate(-90 60 295)">RTT 2</text>

  <line x1="110" y1="260" x2="370" y2="260" stroke="#8a97a0" stroke-width="3" marker-end="url(#arrLeft)"/>
  <text x="240" y="252" text-anchor="middle" font-size="13" fill="#5b6670">ClientKeyExchange · Finished</text>

  <line x1="370" y1="320" x2="110" y2="320" stroke="#8a97a0" stroke-width="3" marker-end="url(#arrLeft)"/>
  <text x="240" y="312" text-anchor="middle" font-size="13" fill="#5b6670">Finished</text>

  <line x1="110" y1="380" x2="370" y2="380" stroke="#b3492f" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrLeftRed)"/>
  <text x="240" y="372" text-anchor="middle" font-size="13" fill="#b3492f">Application Data (2-RTT 이후)</text>

  <!-- ===== RIGHT: TLS 1.3, 1-RTT ===== -->
  <text x="760" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#14181b">TLS 1.3</text>
  <text x="760" y="76" text-anchor="middle" font-size="16" fill="#0f7a72">풀 핸드셰이크 · 1 RTT</text>

  <line x1="630" y1="110" x2="630" y2="560" stroke="#bfe4de" stroke-width="2"/>
  <line x1="890" y1="110" x2="890" y2="560" stroke="#bfe4de" stroke-width="2"/>
  <text x="630" y="100" text-anchor="middle" font-size="15" fill="#0f7a72">Client</text>
  <text x="890" y="100" text-anchor="middle" font-size="15" fill="#0f7a72">Server</text>

  <path d="M 605 120 v 220 h 10" fill="none" stroke="#0f7a72" stroke-width="2"/>
  <text x="580" y="235" text-anchor="middle" font-size="13" fill="#0f7a72" transform="rotate(-90 580 235)">RTT 1</text>

  <line x1="630" y1="140" x2="890" y2="140" stroke="#0f7a72" stroke-width="3" marker-end="url(#arrTeal)"/>
  <text x="760" y="132" text-anchor="middle" font-size="13" fill="#0f7a72">ClientHello + key_share</text>

  <line x1="890" y1="200" x2="630" y2="200" stroke="#0f7a72" stroke-width="3" marker-end="url(#arrTeal)"/>
  <text x="760" y="192" text-anchor="middle" font-size="12.5" fill="#0f7a72">ServerHello · EncryptedExt · Cert · CertVerify · Finished</text>

  <line x1="630" y1="260" x2="890" y2="260" stroke="#0f7a72" stroke-width="3" marker-end="url(#arrTeal)"/>
  <text x="760" y="252" text-anchor="middle" font-size="13" fill="#0f7a72">Finished</text>

  <line x1="630" y1="320" x2="890" y2="320" stroke="#0f7a72" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrTeal)"/>
  <text x="760" y="312" text-anchor="middle" font-size="13" fill="#0f7a72">Application Data (RTT 1과 동시)</text>

  <defs>
    <marker id="arrLeft" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a97a0"/>
    </marker>
    <marker id="arrLeftRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b3492f"/>
    </marker>
    <marker id="arrTeal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f7a72"/>
    </marker>
  </defs>

  <text x="500" y="605" text-anchor="middle" font-size="13" fill="#93a1ab">직접 캡처한 openssl s_client -msg -state 트레이스(www.google.com:443, 2026-08-22) 기반 단순화</text>
</svg>
