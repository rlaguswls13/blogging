<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0d1417"/>

  <!-- two endpoint nodes + connecting line (client <-> server handshake) -->
  <line x1="330" y1="150" x2="870" y2="150" stroke="#2a3b3f" stroke-width="3" stroke-dasharray="2 10"/>
  <circle cx="330" cy="150" r="9" fill="#5fd6c4"/>
  <circle cx="870" cy="150" r="9" fill="#5fd6c4"/>
  <text x="330" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#93a1ab">Client</text>
  <text x="870" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#93a1ab">Server</text>

  <!-- padlock icon, centered -->
  <g transform="translate(600 330)">
    <path d="M -55 -20 v -35 a 55 55 0 0 1 110 0 v 35" fill="none" stroke="#5fd6c4" stroke-width="16" stroke-linecap="round"/>
    <rect x="-85" y="-20" width="170" height="130" rx="18" fill="#5fd6c4"/>
    <circle cx="0" cy="35" r="14" fill="#0d1417"/>
    <rect x="-7" y="35" width="14" height="34" rx="6" fill="#0d1417"/>
  </g>

  <text x="600" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="56" fill="#e8edf0">TLS Handshake</text>
  <text x="600" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#5fd6c4">1-RTT 원리와 HTTPS 인증서 검증</text>
</svg>
